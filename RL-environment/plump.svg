<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Plump</title>
  <desc id="desc">A retro computer-game tile with cards around a green table.</desc>
  <defs>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#3e8a50"/>
      <rect x="0" y="0" width="1" height="1" fill="#2e7240"/>
      <rect x="2" y="2" width="1" height="1" fill="#2e7240"/>
    </pattern>
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#deded7"/>
      <rect width="4" height="1" fill="#a9a9a3"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="716" height="406" fill="#77776f"/>
  <rect width="716" height="406" fill="#fbfbf7" stroke="#11110f" stroke-width="2"/>
  <rect x="1" y="1" width="714" height="34" fill="url(#stripes)" stroke="#11110f" stroke-width="2"/>
  <rect x="14" y="10" width="16" height="16" fill="#deded7" stroke="#11110f" stroke-width="2"/>
  <rect x="683" y="10" width="16" height="16" fill="#deded7" stroke="#11110f" stroke-width="2"/>
  <rect x="321" y="7" width="75" height="22" fill="#deded7"/>
  <text x="359" y="23" fill="#11110f" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle">PLUMP</text>
  <ellipse cx="358" cy="221" rx="245" ry="143" fill="url(#dither)" stroke="#11110f" stroke-width="3"/>
  <ellipse cx="358" cy="221" rx="226" ry="124" fill="none" stroke="#d9b829" stroke-width="3"/>
  <g transform="translate(318 135) rotate(-8)">
    <rect x="3" y="4" width="72" height="101" fill="#77776f"/>
    <rect width="72" height="101" fill="#fbfbf7" stroke="#11110f" stroke-width="2"/>
    <text x="11" y="23" fill="#c73b32" font-family="Courier New,monospace" font-size="19" font-weight="700">A</text>
    <text x="36" y="65" fill="#c73b32" font-family="Times New Roman,serif" font-size="42" text-anchor="middle">♥</text>
  </g>
  <g transform="translate(365 143) rotate(9)">
    <rect x="3" y="4" width="72" height="101" fill="#77776f"/>
    <rect width="72" height="101" fill="#fbfbf7" stroke="#11110f" stroke-width="2"/>
    <text x="11" y="23" fill="#11110f" font-family="Courier New,monospace" font-size="19" font-weight="700">K</text>
    <text x="36" y="65" fill="#11110f" font-family="Times New Roman,serif" font-size="42" text-anchor="middle">♠</text>
  </g>
  <text x="358" y="317" fill="#fbfbf7" stroke="#11110f" stroke-width="1" paint-order="stroke" font-family="Times New Roman,serif" font-size="57" font-weight="700" text-anchor="middle">Plump</text>
  <g font-family="Courier New,monospace" font-size="12" fill="#11110f" text-anchor="middle">
    <text x="358" y="384">A FAMILY CARD GAME · PLAYER VS PPO</text>
